# Project-wide Gradle settings

# Single source of truth for the app version.
# Bump these two and add a matching `## [<versionName>] - YYYY-MM-DD`
# heading to CHANGELOG.md; everything else (APK metadata, ImGui menu
# title, Info tab, release workflow tag) reads from these.
aimbuddy.versionName=0.3.0-beta.18
aimbuddy.versionCode=20

# Use AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Daemon and parallel builds
org.gradle.daemon=true
# Let the foojay resolver provision the Java 21 (JetBrains) toolchain that
# AGP 9.0 / Kotlin 2.1 require for this build.
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
# G1GC for better GC throughput on large builds
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# NDK settings - suppress verbose native output in release builds
# android.native.buildOutput is omitted to use AGP default (quiet output)
android.dependency.useConstraints=false
