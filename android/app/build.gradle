def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.example.realtime_mahjong_trainer"
    compileSdkVersion 34
    // 固定 NDK 版本，确保 CI（GitHub Actions）构建确定可复现
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.realtime_mahjong_trainer"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

chaquopy {
    defaultConfig {
        pip {
            // mahjong 已内置并 vendoring 到 android/app/src/main/python/mahjong，
            // 不依赖 PyPI/镜像版本，避免云端构建因版本漂移或镜像不可用而失败。
            // The latest version available on https://chaquo.com/pypi-13.1/
            install("opencv-python~=4.5.1")

            install("pillow")

            // TFLite 推理（Chaquopy 镜像提供 2.5.0 的 cp38 Android ABI wheels），
            // 用于替换手写几何分类器——34 类小 CNN 在设备端单张推理 <5ms。
            install("tflite-runtime~=2.5.0")
        }
        // Portable: chaquopy auto-detects python3; the previous Nix path only works inside a nix-shell.
        buildPython("python3")
    }
    // tflite_assets/ 目录在 src/main/python/ 下，Chaquopy 默认就会扫描
    // src/main/python/ 所有文件并打包进 assets/chaquopy/app.imy，所以模型随 APK
    // 自动发布，无需额外 sourceSets 配置（之前手写的 sourceSets 块编译失败）。
}

