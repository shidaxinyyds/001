name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build native code with ndk-build
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== NDK path ==="
          echo "$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME/ndk-build"
          chmod +x "$ANDROID_NDK_HOME/ndk-build"
          echo "=== jni/ directory ==="
          ls -la jni/
          echo "=== Source files ==="
          find jni/src -name "*.c*" -o -name "*.cpp" | head -30
          echo "=== Prebuilt libraries ==="
          ls -la jni/src/CPUaffinity/libPikachu.a jni/include/lib/libcurl.a
          echo "=== Running ndk-build ==="
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_OUT=build/ndk/obj \
            NDK_LIBS_OUT=build/ndk/libs \
            V=1
          echo "=== ndk-build exit code: $? ==="
          echo "=== Build output ==="
          find build/ndk -type f 2>/dev/null || echo "No build output found"

      - name: Copy native binary to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build/ndk/libs/arm64-v8a/m app/src/main/jniLibs/arm64-v8a/libberry.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libberry.so
          echo "Binary copied:"
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BerryKernel-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
