name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: |
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_report.log 2>&1; then
            cat analyze_report.log
            echo "### ❌ Flutter Analyze Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_report.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < analyze_report.log
            exit 1
          fi
          echo "### ✅ Flutter Analyze Passed" >> $GITHUB_STEP_SUMMARY

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        env:
          LICENSE_TOKEN_SECRET: ${{ secrets.LICENSE_TOKEN_SECRET }}
          LICENSE_FUNCTION_URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          set -euo pipefail
          # 公开仓库里绝不能有授权密钥：两个 Secret 缺任何一个都直接拒建，
          # 避免发布出一个"激活必失败"的坏包。
          if [ -z "$LICENSE_TOKEN_SECRET" ] || [ -z "$LICENSE_FUNCTION_URL" ]; then
            echo "::error::仓库 Settings→Secrets 缺少 LICENSE_TOKEN_SECRET 或 LICENSE_FUNCTION_URL，拒绝构建无授权注入的坏包"
            exit 1
          fi
          flutter build apk --release --no-shrink \
            --dart-define=LICENSE_TOKEN_SECRET="$LICENSE_TOKEN_SECRET" \
            --dart-define=LICENSE_FUNCTION_URL="$LICENSE_FUNCTION_URL"

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.7.1
          name: "雀神助手 局况事实层与实时响应修复版 v1.7.1 APK"
          body: |
            ## 雀神助手 v1.7.1 安装包

            ### 本版修了什么
            - **手牌识别缺张路径闭合**：手牌通道改为「整屏为主 + 底部条带同帧反超」，同一帧被两套格网切致少读一张的路径已闭合，两套格数差异写进诊断供排障；
            - **弹窗响应延迟**：跳帧帧差门槛下调 + 手牌稳定器确认窗口收敛 + UI 改前沿 0ms 上屏（36ms 尾部合并），不再搭 2s 班车；
            - **「等待牌局开始」误报与幻影牌**：空手牌硬重置门槛 3→5 帧、warmup 期不再重置、亮度判据整行自适应、候选闸门过滤幻影；
            - **局况事实层上线**：开/换三张/定缺/选牌/轮到你/候牌/副露/听牌/结束全部由帧观测折算，关键事件以 ~2.5s 自动消失的瞬时胶囊播报（悬浮窗不新增任何常驻控件）；
            - **调试页开关复活**：「严格识别门槛」此前因判据顺序恒真是哑炮，本轮修正为真实下发门槛。

            ### 实测数据（PC 夹具，非手机端）
            - 接线守卫 `run_all_guards.py` **34 条全绿、红 0**；变异检验 `--mutate` **16 条全绿**；
            - 全量评估 `run_all_tests.py` **38/40 通过**，剩余 2 项为既有评估集红项（非本轮引入）；
            - 腾讯格网 GT 37 帧全链路：手牌 **37/37 帧、逐张 444/444**，与改前持平（无精度倒退）；蜀山评估集 6/7 帧、82/84 张（改前 4/7、80/84）；
            - 单帧端到端延迟 p50 **556.7ms** / p95 1068.1ms / p99 1663.7ms（120 帧恰好 120 次手牌通道调用，未多付识别）；距 ≤300ms 目标仍差在推理段，未达成，如实标注；

            ### 历史能力（v1.7.0 继承）
            - **对手手牌贝叶斯概率透视与危险流向反推 (Bayesian Hand Range Reading & Danger Flow)**：结合定缺物理坍缩、现物折损与筋牌防御法则，实时推断三家手牌概率分布与点炮高危度，知己知彼；
            - **全场实时胡牌胜率与期望收益雷达 (Win Equity & EV Gauge)**：结合对手听牌竞争模型、听牌枚数与期望番数，输出精准全场胜率、净收益预估与攻防决策胶囊；
            - **轻量级强化学习策略价值网络 (Policy-Value Network)**：引入双头网络架构（策略先验分布 π 与盘面价值标量 v），深度融合打牌 EV 综合评分，告别机械死算；
            - **视觉检测引擎升级 YOLO11-Nano (2024年底最新一代)**：原生 OpenCV cv2.dnn 多线程半精度 FP16 硬件加速与 50 倍 NumPy 矢量化后处理，告别模型空转；
            - 手机端直接点击下方 `app-release.apk` 即可下载安装！
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
