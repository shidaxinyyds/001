name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        env:
          LICENSE_TOKEN_SECRET: ${{ secrets.LICENSE_TOKEN_SECRET }}
          LICENSE_FUNCTION_URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          set -euo pipefail
          # 公开仓库里绝不能有授权密钥：两个 Secret 缺任何一个都直接拒建，
          # 避免发布出一个"激活必失败"的坏包。
          if [ -z "$LICENSE_TOKEN_SECRET" ] || [ -z "$LICENSE_FUNCTION_URL" ]; then
            echo "::error::仓库 Settings→Secrets 缺少 LICENSE_TOKEN_SECRET 或 LICENSE_FUNCTION_URL，拒绝构建无授权注入的坏包"
            exit 1
          fi
          flutter build apk --release --no-shrink \
            --dart-define=LICENSE_TOKEN_SECRET="$LICENSE_TOKEN_SECRET" \
            --dart-define=LICENSE_FUNCTION_URL="$LICENSE_FUNCTION_URL"

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.5.2
          name: "雀神助手 全平台与多玩法通用版 v1.5.2 APK"
          body: |
            ## 雀神助手 全平台与多玩法通用版 v1.5.2 安装包
            - **彻底根治“开启悬浮窗后退回激活页”**：严格限制仅在卡密真正过期或被服务端拉黑时才允许跳转激活页；禁止任何切前后台、开窗弹窗、网络超时、指纹延迟导致的误踢；
            - **本地凭证与指纹持久化保护**：严禁在非拉黑异常中清除本地合法凭证；支持跨引擎持久化共享设备指纹；
            - **消除开窗 3 秒卡顿死等**：修复 OverlayService 原生单例赋值，位置校正瞬间就绪；
            - **全套测试回归 100% 满分**：通过 Dart 静态检查（0 issue）与全套单元测试回归。
            - **授权页去误导文案**：删除营销字样，“授权已到期”只在签名 expires_at 真到期时显示；拉黑/换设备/篡改等展示服务器拒因原文；网络波动/切页/后台恢复绝不再踢回激活页；
            - **主页切玩法零卡顿**：玩法点选乐观更新即时高亮，原生落地失败自动回滚；悬浮窗回传订阅防重建泄漏，识别数据数值安全转换；
            - **弹窗数据零臆造**：新局重置字牌矩阵改按玩法牌墙推导（108 无字 / 112 仅红中 / 136 全字牌），锁定胶囊按真实拒因显示；
            - **全 10 玩法回归**：川麻/经典/地方三系列 27 例规则测试 + 27 例 Dart 测试全绿，识别与决策链路零改动；
            - 手机端直接点击下方 `app-release.apk` 即可下载安装！
            
            > 上一版 v1.5.0 核心：全 App Material 3 商务级 UI 换脸 + 授权持久化修复。
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
