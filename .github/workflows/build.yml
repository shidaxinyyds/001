name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        env:
          LICENSE_TOKEN_SECRET: ${{ secrets.LICENSE_TOKEN_SECRET }}
          LICENSE_FUNCTION_URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          set -euo pipefail
          # 公开仓库里绝不能有授权密钥：两个 Secret 缺任何一个都直接拒建，
          # 避免发布出一个"激活必失败"的坏包。
          if [ -z "$LICENSE_TOKEN_SECRET" ] || [ -z "$LICENSE_FUNCTION_URL" ]; then
            echo "::error::仓库 Settings→Secrets 缺少 LICENSE_TOKEN_SECRET 或 LICENSE_FUNCTION_URL，拒绝构建无授权注入的坏包"
            exit 1
          fi
          flutter build apk --release --no-shrink \
            --dart-define=LICENSE_TOKEN_SECRET="$LICENSE_TOKEN_SECRET" \
            --dart-define=LICENSE_FUNCTION_URL="$LICENSE_FUNCTION_URL"

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.5.0
          name: "雀神助手 全平台与多玩法通用版 v1.5.0 APK"
          body: |
            ## 雀神助手 全平台与多玩法通用版 v1.5.0 安装包
            - **全 App Material 3 商务级 UI 换脸**：新增统一设计系统（品牌 token + M3 主题），激活页 / 首页 / 调试页 / 悬浮窗全面焕新，明亮现代商务质感；
            - **激活 / 授权页品牌化重建**：渐变底 + 卡片式布局 + 品牌徽标 + 激活成功徽章，卡密输入与主操作按钮统一 M3 观感；
            - **首页主题化与微交互**：分类分段器 / 玩法卡片 tonal 选中态 / 主按钮 FilledButton / 状态徽章动效，切分类与待命↔运行均有过渡动画；
            - **悬浮窗面板质感升级**：圆角 / 描边 / 间距精修，收起↔展开轻量淡入过渡；
            - **识别与授权逻辑零改动**：Python 引擎、卡密授权心跳 / 宽限 / 双层锁窗、悬浮窗数据链路、牌河双账本全部保持不变，仅换外观；
            - 手机端直接点击下方 `app-release.apk` 即可下载安装！
            
            > 上一版 v1.4.9 核心：授权到期双层强制锁窗 + 服务器时间锚点 + 换设备/拉黑即时拒杀 + 决策引擎正确性 + 识别精度加固。
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
