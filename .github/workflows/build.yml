name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: |
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_report.log 2>&1; then
            cat analyze_report.log
            echo "### ❌ Flutter Analyze Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_report.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < analyze_report.log
            exit 1
          fi
          echo "### ✅ Flutter Analyze Passed" >> $GITHUB_STEP_SUMMARY

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        env:
          LICENSE_TOKEN_SECRET: ${{ secrets.LICENSE_TOKEN_SECRET }}
          LICENSE_FUNCTION_URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          set -euo pipefail
          # 公开仓库里绝不能有授权密钥：两个 Secret 缺任何一个都直接拒建，
          # 避免发布出一个"激活必失败"的坏包。
          if [ -z "$LICENSE_TOKEN_SECRET" ] || [ -z "$LICENSE_FUNCTION_URL" ]; then
            echo "::error::仓库 Settings→Secrets 缺少 LICENSE_TOKEN_SECRET 或 LICENSE_FUNCTION_URL，拒绝构建无授权注入的坏包"
            exit 1
          fi
          flutter build apk --release --no-shrink \
            --dart-define=LICENSE_TOKEN_SECRET="$LICENSE_TOKEN_SECRET" \
            --dart-define=LICENSE_FUNCTION_URL="$LICENSE_FUNCTION_URL"

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 发布 tag 与发布说明一律从 pubspec / CHANGELOG 取，不写死在 workflow 里。
      # 曾经这里硬编码 `tag_name: v1.7.2`：结果 v1.7.4 的 APK 被传到了 v1.7.2 的 tag
      # 上（直链文件名与包内容对不上），而 workflow 本身还是绿的。写死的 tag +
      # 写死的正文必然会在下一次升版时错配，所以改成算出来，并当场断言两者一致。
      - name: 算发布版本与发布说明
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version: \([0-9][0-9.]*\)+[0-9]*/\1/p' pubspec.yaml | head -1)
          BUILD=$(sed -n 's/^version: [0-9][0-9.]*+\([0-9]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$VER" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec.yaml 里没解析出 version（VER=$VER BUILD=$BUILD）"
            exit 1
          fi
          # 取 CHANGELOG「## [未发布]」下的第一个 ### 小节（本次发布的逐条归因）。
          # 两个坑都踩过：退出条件写成 `^#` 而不是 `^#{2,3}`（runner 默认 awk 是 mawk，
          # 区间量词不总生效）；进入小节后必须把 s 关掉，否则每一条规则对同一行都会
          # 依次判一遍，后面的 `### ` 仍命中「第一条小节」规则，整份 CHANGELOG 会被
          # 当成发布正文（本地复现脚本 localtest/check_release_step.sh 当场抠出来的）。
          awk '/^## \[未发布\]/{s=1; next} s && /^### /{t=1; s=0; print; next} t && /^#/{exit} t{print}' \
            CHANGELOG.md > "$RUNNER_TEMP/section.md"
          if [ "$(wc -l < "$RUNNER_TEMP/section.md")" -gt 80 ]; then
            echo "::error::发布正文抽了 $(wc -l < "$RUNNER_TEMP/section.md") 行（>80），节选规则坏了"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/section.md" ]; then
            echo "::error::CHANGELOG 没有与本次发布对应的「未发布」小节，拒绝发布空正文的 release"
            exit 1
          fi
          # 正文必须自报版本：防止「tag v1.7.4、正文讲 v1.7.2」这种错配再一次发生
          if ! grep -q "v$VER" "$RUNNER_TEMP/section.md"; then
            echo "::error::CHANGELOG 首节未提及 v$VER（pubspec 当前版本），发布说明与包不是同一版"
            exit 1
          fi
          {
            echo "### 雀神助手 v$VER+$BUILD 安装包"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo '手机端直接点击下方 `app-release.apk` 即可下载安装！'
          } > "$RUNNER_TEMP/release_body.md"
          echo "RELEASE_TAG=v$VER" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=雀神助手 v$VER+$BUILD APK" >> "$GITHUB_ENV"
          echo "发布 tag: v$VER（构建号 $BUILD）"

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ runner.temp }}/release_body.md
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
