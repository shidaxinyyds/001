name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: |
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_report.log 2>&1; then
            cat analyze_report.log
            echo "### ❌ Flutter Analyze Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_report.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < analyze_report.log
            exit 1
          fi
          echo "### ✅ Flutter Analyze Passed" >> $GITHUB_STEP_SUMMARY

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        env:
          LICENSE_TOKEN_SECRET: ${{ secrets.LICENSE_TOKEN_SECRET }}
          LICENSE_FUNCTION_URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          set -euo pipefail
          # 公开仓库里绝不能有授权密钥：两个 Secret 缺任何一个都直接拒建，
          # 避免发布出一个"激活必失败"的坏包。
          if [ -z "$LICENSE_TOKEN_SECRET" ] || [ -z "$LICENSE_FUNCTION_URL" ]; then
            echo "::error::仓库 Settings→Secrets 缺少 LICENSE_TOKEN_SECRET 或 LICENSE_FUNCTION_URL，拒绝构建无授权注入的坏包"
            exit 1
          fi
          flutter build apk --release --no-shrink \
            --dart-define=LICENSE_TOKEN_SECRET="$LICENSE_TOKEN_SECRET" \
            --dart-define=LICENSE_FUNCTION_URL="$LICENSE_FUNCTION_URL"

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.7.2
          name: "雀神助手 局况感知纠偏与推理提速版 v1.7.2 APK"
          body: |
            ## 雀神助手 v1.7.2 安装包

            ### 本版修了什么（对齐真机反馈的四件事）
            - **阶段感知错乱（不在换牌却显示换牌，反之也是）**：换牌判据剔除已被实测证伪的青色「过」反证，改用换牌按钮低带 + 形状三窗口（41 帧实测值，不许随手放宽）；迟滞续帧 3→1；阶段排他只认牌局账本（弃牌/副露），拆掉引擎自己立的伪铁律「立牌 >=14 张 ⇒ 已摸牌 ⇒ 不在换牌」——GT 里 s_6d33/t2 两帧同时是 14 张立牌与换三张阶段；
            - **局况不再拿张数编事**：「立牌等于基数」只推出「轮不到你」，推不出「你刚打完一张」（开局未摸牌时本家也是 13 张）；定缺事件只能来自牌桌徽章或手动指定，推荐值不再被播成「定缺敲定」；同一局缺门改口只计入 `evidence.rejected.dingque_conflict` 不播报；
            - **有手牌却不显示 / 莫名「等待牌局开始」**：新增出口不变量——报 `waiting` 却带着本帧真读到的牌就升级为 `partial`；读到 1~5 张不再被整块藏起（旧实现直接报等待开局）；瞬态阻尼与 partial 兜底去掉 `_match_started` 前置；悬浮窗闸门只信「引擎真报出了牌」，不再自行二次否定引擎读数（闸门改造后遗留的 4 个「算了却没人读」的阶段局部量一并清掉）；
            - **定缺徽章读数的时间稳定门（面板自噬的第三道次级防线）**：悬浮窗压住徽章取区时读到的是面板 chip 颜色（真机 s2 报筒、s4 报条）。像素启发式已实测证伪并拆除，还能区分的只剩时间轴：最近 3 次扫描里非空读数必须彼此全等才可信，出现分歧就整体判「没读到」（宁可不报也不让最后一枪直接上屏）；新局与换朝向作废窗口，抽搐扣下有计数可追溯。如实声明：这道门只挡「抽搐」，**不挡持续遮挡**，彻底解法是面板矩形事实源（需真机验证，尚未做）；
            - **定缺三色盘面积窗改分辨率无关**（此前同一局在不同分辨率下一个判得出一个判不出）；
            - **推理提速（动手四刀，均以逐帧输出零差异为上线前提；第三刀实测否决未落地，第五刀是一项死常量处置）**：① 风格核预算——声明腾讯后不再扫蜀山牌风，每片 110 核（此前白挂 76 枚），37 帧 hand/status/dingque 逐帧差异 0；② 张数候选序贯早停——先只切第一档，均分 <0.55 才回到全候选重扫，41 帧逐格全等；中途那层「不达标先补跑第二档」的兜底实测从未生效，已删；③ 决策层 memo 实测否决（非稳态成本中心，不落地）；④ 打分改「粗筛+精算」两阶段（图与核同缩一半，精算集 = 粗筛前 3 ∪ 分差 0.06 带 ∪ `_decide` 七条相邻类闭包），738 次真实调用打分 11.26 → 5.71ms/枚（-49.3%）且逐枚最终裁决全等；⑤ 删掉从未接线的死常量 `MAX_SKIP_FRAMES`，改为累计漂移门（同一阈值，不新增参数）；

            ### 实测数据（PC 夹具，非手机端）
            - 接线守卫 `run_all_guards.py` **39 条全绿、红 0**；变异检验 `--mutate` **21 条全绿、红 0**（本版新增 5 个守卫：真机四帧阶段回归/风格核预算/张数早停/定缺时间稳定门/粗筛精算一致性）；
            - 腾讯格网 GT 37 帧全链路：手牌 **37/37 帧、逐张 444/444**、阶段 status **37/37**、定缺 **10/10**，与改前持平（无精度倒退）；
            - 单帧端到端（37 帧常驻 Engine 连续跑帧）均值 **187.1 → 128.7ms**、中位 95.2 → **60.1ms**、最差 1049.0 → **696.6ms**；逐枚打分单价 11.26 → 5.71ms；
            - 未达成项如实标注：≤300ms 是 PC 夹具口径，**手机端尚未真机复测**（本环境无 Android 工具链/Flutter SDK）；跳帧与硬重置带来的卡顿改善、暗光不再误报、连续 30 分钟无泄漏均**必须真机目测**；

            ### 历史能力（v1.7.0 继承）
            - **对手手牌贝叶斯概率透视与危险流向反推 (Bayesian Hand Range Reading & Danger Flow)**：结合定缺物理坍缩、现物折损与筋牌防御法则，实时推断三家手牌概率分布与点炮高危度，知己知彼；
            - **全场实时胡牌胜率与期望收益雷达 (Win Equity & EV Gauge)**：结合对手听牌竞争模型、听牌枚数与期望番数，输出精准全场胜率、净收益预估与攻防决策胶囊；
            - **轻量级强化学习策略价值网络 (Policy-Value Network)**：引入双头网络架构（策略先验分布 π 与盘面价值标量 v），深度融合打牌 EV 综合评分，告别机械死算；
            - **视觉检测引擎升级 YOLO11-Nano (2024年底最新一代)**：原生 OpenCV cv2.dnn 多线程半精度 FP16 硬件加速与 50 倍 NumPy 矢量化后处理，告别模型空转；
            - 手机端直接点击下方 `app-release.apk` 即可下载安装！
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
