name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        env:
          LICENSE_TOKEN_SECRET: ${{ secrets.LICENSE_TOKEN_SECRET }}
          LICENSE_FUNCTION_URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          set -euo pipefail
          # 公开仓库里绝不能有授权密钥：两个 Secret 缺任何一个都直接拒建，
          # 避免发布出一个"激活必失败"的坏包。
          if [ -z "$LICENSE_TOKEN_SECRET" ] || [ -z "$LICENSE_FUNCTION_URL" ]; then
            echo "::error::仓库 Settings→Secrets 缺少 LICENSE_TOKEN_SECRET 或 LICENSE_FUNCTION_URL，拒绝构建无授权注入的坏包"
            exit 1
          fi
          flutter build apk --release --no-shrink \
            --dart-define=LICENSE_TOKEN_SECRET="$LICENSE_TOKEN_SECRET" \
            --dart-define=LICENSE_FUNCTION_URL="$LICENSE_FUNCTION_URL"

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.4.9
          name: "雀神助手 全平台与多玩法通用版 v1.4.9 APK"
          body: |
            ## 雀神助手 全平台与多玩法通用版 v1.4.9 安装包
            - **授权到期双层强制锁窗**：主 App 进入前台 / 打开悬浮窗 / 每 30 分钟 / 到期精确点四处强制服务器心跳核验，悬浮窗子引擎独立按设备 60 秒心跳自锁；卡密到期最迟约 1 分钟内悬浮窗转禁用胶囊、主页退回激活页、按钮置灰，无需重开 App；
            - **以服务器签名时间为准**：新增服务器时间锚点（单调钟测流逝 + 高水位兜底），改本地时间无法续命；断网走 72 小时离线宽限，宽限绝不越过总到期；
            - **换设备 / 拉黑即时拒杀**：心跳明确 valid:false 即清本地凭证并硬锁，旧券无法复用；
            - **决策引擎正确性**：13 张预摸牌期望分析 + 定缺全链约束 + 3n 向听分支，进张/叫口不再恒 0，建议真正可用；
            - **状态机与防幻觉**：解开牌河锁死锁、空帧宽限、重复爆炸校验，换三张/定缺/对局切换不再闪现"等待牌局开始/未检测到手牌"，断流 2s 显示"信号中断"而非假实时；
            - **端到端延迟**：牌河/副露分类提速、智能跳帧恢复驱动动态采集节奏、帧差向量化、网络发送异步化解阻塞采集线程；
            - **识别精度加固**：拆除"全有或全无"断崖改逐张置信救援、牌河双账本防记牌器漂移、四区归属展示、门槛统一、多帧投票恢复；
            - 手机端直接点击下方 `app-release.apk` 即可下载安装！
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
