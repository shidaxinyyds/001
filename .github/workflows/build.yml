name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Chaquopy 需要 Python 解释器来打包安卓内的 pygame/mahjong 依赖
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用与已验证可用的 “Build Debug APK” 工作流一致的 Flutter 3.13.0，
      # 避免 3.16+ 对旧式 app_plugin_loader 命令式引入的兼容性问题。
      - name: 配置 Flutter 3.13.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          channel: stable
          cache: true

      - name: 同意 Android 许可协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 先用 Flutter 3.13 自带的 Dart 3.1 做一次静态检查，快速暴露版本不兼容问题
      # （例如误用 Flutter 3.27+ 才有的 Color.withValues）。
      # 否则要等 2 分多钟把 Chaquopy 依赖全部下完，才在 kernel_snapshot 阶段报错。
      - name: Dart 静态检查（快速失败）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 APK（release，使用 debug 签名，可直接安装）
        run: |
          set -euo pipefail
          flutter build apk --release --no-shrink

      # 防「绿灯但无 APK」假成功：构建步骤即便异常返回 0，也必须在此处
      # 断言产物真实存在且非空，否则显式失败，避免误以为发布成功。
      - name: 校验 APK 产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::构建步骤结束但未生成有效 APK（$APK 不存在或为空），判定为构建异常"
            exit 1
          fi
          echo "APK 路径: $APK"
          echo "APK 大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自动发布 GitHub Release (手机免登录直链)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.4.0
          name: "雀神助手 全流程实战强化版 v1.4.0 APK"
          body: |
            ## 雀神助手 全流程实战强化版 v1.4.0 安装包
            - **移除手牌遮挡**：彻底移除手牌区域所有覆盖在牌面角上的绿色“安”字角标，玩家看牌视野100%无遮挡！
            - **根除画面卡死“画面识别中…”**：彻底移除突变守卫丢帧截断，换牌/定缺/选牌弹窗弹出时绝不丢帧，毫秒级进入对应阶段！
            - **根除开局前阶段死锁**：彻底移除 `river_locked` 硬门控，换三张、选一张牌、定缺选盘100%无条件感知，新一局开局自动清空旧牌池残留！
            - **修复定缺徽章误判**：大幅提升黄色“筒”定缺徽章阈值，过滤常驻奖杯底噪，杜绝开局发牌误认定缺！
            - **强化任选一张牌感知**：兼容横排选牌弹窗与中央大牌+“选牌确定”双态检测！
            - **修复开局假死“等待牌局开始”**：只要手牌发完，立即确认为对局中，实时给出进张与做牌推演，绝不卡在等待！
            - **界面醒目标识**：悬浮窗标题栏清晰标注 `PRO v1.4`，安装后一眼确认！
            - 手机端直接点击下方 `app-release.apk` 即可下载安装！
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
