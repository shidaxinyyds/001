name: license-heartbeat

# 防止 Supabase 免费项目因 7 天无请求被自动暂停。
# 每天向 Edge Function 打一发最小请求（不碰数据库、无副作用），让项目保持活跃。
# 部署好 Function 后，把 URL 填到仓库 Settings → Secrets → LICENSE_FUNCTION_URL。
on:
  schedule:
    - cron: '17 */12 * * *' # 每天两次，错开整点
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: keep project awake
        env:
          URL: ${{ secrets.LICENSE_FUNCTION_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "LICENSE_FUNCTION_URL 未配置，跳过"; exit 0
          fi
          curl -s -o /dev/null -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d '{"action":"heartbeat"}' || true
